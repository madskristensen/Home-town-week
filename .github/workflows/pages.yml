name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so sitemap lastmod can use each file's commit time.
          # A depth of 1 makes every unchanged page look unmodified.
          fetch-depth: 0

      - name: Check shared components
        run: python3 script/check-components.py

      - name: Check event areas
        run: |
          python3 -m pip install --quiet pyyaml
          python3 script/check-event-areas.py

      - name: Fill venue settings for this build
        run: python3 script/apply-venue-settings.py

      - name: Check event records
        run: python3 script/check-events.py

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Fingerprint source images
        id: images
        run: echo "hash=$(python3 script/render-image-variants.py --fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore image variant cache
        uses: actions/cache@v6
        with:
          path: .image-cache
          key: image-variants-v1-${{ steps.images.outputs.hash }}
          restore-keys: |
            image-variants-v1-

      - name: Generate image variants
        run: |
          # Encode only on a cache miss. A failed width is omitted from the
          # manifest and the page keeps the original file. The build continues.
          if python3 script/render-image-variants.py --check-cache; then
            python3 script/render-image-variants.py --from-cache
          else
            python3 -m pip install --quiet Pillow pillow-avif-plugin
            python3 script/render-image-variants.py
          fi

      - name: Render the home share image
        run: |
          # One 1200x630 card from the Eastside map. A map edit on this
          # push updates the image. The PNG is not committed.
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-liberation
          python3 -m pip install --quiet Pillow
          python3 script/render-home-og.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Fingerprint share cards
        id: share
        run: echo "hash=$(node script/render-share-cards.mjs --fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore share card cache
        uses: actions/cache@v6
        with:
          path: .share-cache
          key: share-cards-v1-${{ steps.share.outputs.hash }}
          restore-keys: |
            share-cards-v1-

      - name: Render share cards
        run: |
          # 1200x630 cards for cities, hubs, and the two maps. Unchanged
          # photos are copied from the cache. The JPEGs are not committed.
          if [ -f .share-cache/fingerprint ] && [ "$(tr -d '\n' < .share-cache/fingerprint)" = "${{ steps.share.outputs.hash }}" ]; then
            node script/render-share-cards.mjs --from-cache
          else
            npm install --no-save --silent sharp@0.34.4 satori@0.18.3 @resvg/resvg-js@2.6.2
            node script/render-share-cards.mjs
          fi

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: |
          # Custom domain www.eastsidecalendar.com: empty baseurl. Do not fall
          # back to /Home-town-week or the custom-domain CSS and images break.
          # CNAME in the published site must stay www.eastsidecalendar.com.
          # The service worker cache name is this commit, so the new worker
          # replaces the previous caches on activate.
          # rcssmin minifies _css and fingerprints assets/css/<name>.<hash>.css
          # when Jekyll starts. minify-html then compacts the built pages,
          # inline scripts, and JSON-LD.
          python3 -m pip install --quiet rcssmin minify-html
          printf 'sha: "%s"\n' "$GITHUB_SHA" > _data/build.yml
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
          python3 script/minify-html.py
          python3 script/check-components.py --rendered _site
          python3 -m pip install --quiet icalendar
          python3 script/check-calendars.py

      - name: Add IndexNow verification key
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::notice::INDEXNOW_KEY is not configured. Skipping the IndexNow verification file."
            exit 0
          fi
          # Key file at the site root: https://www.eastsidecalendar.com/{key}.txt
          printf '%s' "$INDEXNOW_KEY" > "_site/${INDEXNOW_KEY}.txt"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    name: Submit updated URLs to IndexNow
    runs-on: ubuntu-24.04
    needs: deploy
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - name: Skip IndexNow when not configured
        if: env.INDEXNOW_KEY == ''
        run: echo "::notice::Add the INDEXNOW_KEY repository secret to enable IndexNow submissions."

      - name: Submit changed URLs
        if: env.INDEXNOW_KEY != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Post changed URLs to IndexNow
        if: env.INDEXNOW_KEY != ''
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: python3 script/indexnow-changed.py
