name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so sitemap lastmod can use each file's commit time.
          # A depth of 1 makes every unchanged page look unmodified.
          fetch-depth: 0
          filter: blob:none

      - name: Install Python packages
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Check shared components
        run: python3 script/check-components.py

      - name: Check event areas
        run: python3 script/check-event-areas.py

      - name: Fill venue settings for this build
        run: python3 script/apply-venue-settings.py

      - name: Check event records
        run: python3 script/check-events.py

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          # Reads .ruby-version (3.2.3).
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Fingerprint source images
        id: images
        run: echo "hash=$(python3 script/render-image-variants.py --fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore image variant cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .image-cache
          key: image-variants-v2-${{ steps.images.outputs.hash }}
          restore-keys: |
            image-variants-v2-

      - name: Generate image variants
        run: |
          # Encode only on a cache miss. Card photos are name-400.avif,
          # name-640.avif, and name-640.jpg. Heroes add 800, 1200, and
          # 1600 AVIF. The files are not committed. A referenced photo
          # that cannot be encoded fails the build. Oversized masters
          # are capped in the same cache. The repo files stay as they are.
          if python3 script/render-image-variants.py --check-cache; then
            python3 script/render-image-variants.py --from-cache
          else
            python3 script/render-image-variants.py
          fi

      - name: Fingerprint the home share image
        id: homeog
        run: echo "hash=$(python3 script/render-home-og.py --fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore home share image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .home-og-cache
          key: home-og-v1-${{ steps.homeog.outputs.hash }}
          restore-keys: |
            home-og-v1-

      - name: Render the home share image
        run: |
          # One 1200x630 card from the Eastside map. A map edit on this
          # push updates the image. The PNG is not committed. System
          # packages are installed only when the cache misses.
          if python3 script/render-home-og.py --check-cache; then
            python3 script/render-home-og.py --from-cache
          else
            sudo apt-get update
            sudo apt-get install -y librsvg2-bin fonts-liberation
            python3 script/render-home-og.py
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Fingerprint share cards
        id: share
        run: echo "hash=$(node script/render-share-cards.mjs --fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore share card cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .share-cache
          key: share-cards-v1-${{ steps.share.outputs.hash }}
          restore-keys: |
            share-cards-v1-

      - name: Render share cards
        run: |
          # 1200x630 cards for cities, hubs, and the two maps. Unchanged
          # photos are copied from the cache. The JPEGs are not committed.
          if [ -f .share-cache/fingerprint ] && [ "$(tr -d '\n' < .share-cache/fingerprint)" = "${{ steps.share.outputs.hash }}" ]; then
            node script/render-share-cards.mjs --from-cache
          else
            npm install --no-save --silent sharp@0.34.4 satori@0.18.3 @resvg/resvg-js@2.6.2
            node script/render-share-cards.mjs
          fi

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: |
          # Custom domain www.eastsidecalendar.com: empty baseurl. Do not fall
          # back to /Home-town-week or the custom-domain CSS and images break.
          # CNAME in the published site must stay www.eastsidecalendar.com.
          # The service worker page cache is named from a hash of the shell
          # files. The image cache keeps its name across deploys.
          # rcssmin minifies _css and fingerprints assets/css/<name>.<hash>.css
          # when Jekyll starts. minify-html then compacts the built pages,
          # inline scripts, and JSON-LD.
          printf 'sha: "%s"\n' "$GITHUB_SHA" > _data/build.yml
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
          python3 script/render-image-variants.py --publish-site
          python3 script/minify-html.py
          python3 script/check-schema.py
          python3 script/check-components.py --rendered _site
          python3 script/check-hrefs.py
          python3 script/check-calendars.py

      - name: Add IndexNow verification key
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::notice::INDEXNOW_KEY is not configured. Skipping the IndexNow verification file."
            exit 0
          fi
          # Key file at the site root: https://www.eastsidecalendar.com/{key}.txt
          printf '%s' "$INDEXNOW_KEY" > "_site/${INDEXNOW_KEY}.txt"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  indexnow:
    name: Submit updated URLs to IndexNow
    runs-on: ubuntu-24.04
    needs: deploy
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - name: Skip IndexNow when not configured
        if: env.INDEXNOW_KEY == ''
        run: echo "::notice::Add the INDEXNOW_KEY repository secret to enable IndexNow submissions."

      - name: Submit changed URLs
        if: env.INDEXNOW_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Post changed URLs to IndexNow
        if: env.INDEXNOW_KEY != ''
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 script/indexnow-changed.py
