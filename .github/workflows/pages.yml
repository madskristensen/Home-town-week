name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so sitemap lastmod can use each file's commit time.
          # A depth of 1 makes every unchanged page look unmodified.
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: |
          # Custom domain eastsidecalendar.com: empty baseurl. Do not fall back
          # to /Home-town-week or apex CSS/images break. Actions publishing
          # ignores the CNAME file. The host is the repository Pages setting.
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Add IndexNow verification key
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::notice::INDEXNOW_KEY is not configured. Skipping the IndexNow verification file."
            exit 0
          fi
          printf '%s' "$INDEXNOW_KEY" > "_site/${INDEXNOW_KEY}.txt"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    name: Submit updated URLs to IndexNow
    runs-on: ubuntu-latest
    needs: deploy
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - name: Skip IndexNow when not configured
        if: env.INDEXNOW_KEY == ''
        run: echo "::notice::Add the INDEXNOW_KEY repository secret to enable IndexNow submissions."

      - name: Submit sitemap updates
        if: env.INDEXNOW_KEY != ''
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: "https://eastsidecalendar.com/sitemap.xml"
          key: ${{ env.INDEXNOW_KEY }}
          endpoint: "api.indexnow.org"
          failure-strategy: "error"
