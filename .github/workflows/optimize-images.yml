name: Optimize images

on:
  push:
    branches: ["main"]
    paths:
      - "assets/images/**"
      - "script/optimize-images.py"
      - "script/render-image-variants.py"
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:

# A push made with this token does not start another workflow. The commit
# message also says [skip ci], so a later token change cannot loop. A
# manual run that changes files starts Deploy to GitHub Pages itself.
permissions:
  contents: write
  actions: write

concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install encoders
        run: python3 -m pip install --quiet Pillow pillow-avif-plugin

      - name: Optimize photos
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 script/optimize-images.py --all
          else
            python3 script/optimize-images.py --since "$BEFORE"
            # An encoder change has to revisit photos the push did not touch.
            if git diff --name-only "$BEFORE" HEAD -- script/optimize-images.py script/render-image-variants.py | grep -q .; then
              python3 script/optimize-images.py --missing
            fi
          fi

      - name: Commit optimized images
        id: commit
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard -- assets/images _data/image_variants.yml _data/image_optimize.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Photos are already optimized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets/images _data/image_variants.yml _data/image_optimize.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing staged."
            exit 0
          fi
          git commit -m "Optimize images [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
