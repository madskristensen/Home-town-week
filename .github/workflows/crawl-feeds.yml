name: Crawl structured event feeds

on:
  schedule:
    # Monday and Thursday morning Pacific.
    # 15:30 UTC is 8:30am during Pacific Daylight Time and 7:30am during
    # Pacific Standard Time.
    - cron: "30 15 * * 1,4"
  workflow_dispatch:
    inputs:
      city:
        description: "City id to crawl, or blank for every structured source"
        required: false
        default: ""
        type: string

# A push made with this token does not start another workflow. After a
# commit, this job starts Deploy to GitHub Pages with workflow_dispatch.
permissions:
  contents: write
  actions: write

concurrency:
  group: crawl-structured-events
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Fetch structured feeds
        env:
          CRAWL_CITY: ${{ inputs.city }}
        run: |
          if [ -n "$CRAWL_CITY" ]; then
            python3 script/crawl-structured-events.py --city "$CRAWL_CITY"
          else
            python3 script/crawl-structured-events.py
          fi

      - name: Delete events that ended before today
        run: python3 script/prune-past-events.py

      - name: Commit and push when files changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No event changes to commit."
            exit 0
          fi
          unexpected=0
          while IFS= read -r path; do
            case "$path" in
              _data/*_events.yml|*/index.md) ;;
              *)
                echo "Refusing to commit unexpected path: $path"
                unexpected=1
                ;;
            esac
          done < <(git diff --name-only)
          if [ "$unexpected" -ne 0 ]; then
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Update events from structured feeds."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
