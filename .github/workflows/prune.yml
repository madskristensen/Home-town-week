name: Prune past events

on:
  schedule:
    # Avoid minute 0. GitHub often starts those crons hours late.
    # 09:17 UTC is 2:17am PDT and 1:17am PST, after the Pacific date rolls.
    # 10:47 UTC is the backup, about 90 minutes later, so a delayed first
    # run still rebuilds the home page, hubs, and calendars early.
    - cron: "17 9 * * *"
    - cron: "47 10 * * *"
  workflow_dispatch:

# A push made with this token does not start another workflow. This job
# always starts Deploy to GitHub Pages with workflow_dispatch, which the
# token is allowed to do. The home page weekend block is chosen at build
# time, so the site rebuilds even when no event file changed.
permissions:
  contents: write
  actions: write

concurrency:
  group: prune-past-events
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rebase onto latest main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Install Python packages
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Remove out-of-area events
        run: python3 script/check-event-areas.py --remove

      - name: Fill blank venue settings
        run: python3 script/apply-venue-settings.py

      - name: Delete events that ended before today
        run: python3 script/prune-past-events.py

      - name: Commit and push when files changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No past events to remove."
            exit 0
          fi
          unexpected=0
          while IFS= read -r path; do
            case "$path" in
              _data/*_events.yml|*/index.md|_data/book_ahead.yml) ;;
              *)
                echo "Refusing to commit unexpected path: $path"
                unexpected=1
                ;;
            esac
          done < <(git diff --name-only)
          if [ "$unexpected" -ne 0 ]; then
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Fill venue settings, drop out-of-area events, and remove events that ended before today."
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
