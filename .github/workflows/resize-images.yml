name: Optimize images

on:
  push:
    paths:
      - "assets/images/**"
      - ".github/scripts/resize_images.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resize:
    # This job commits back into assets/images, which is one of the paths
    # that triggers it. Skipping our own bot stops the loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pillow
        # pillow-avif-plugin guarantees an AVIF encoder. Pillow ships AVIF
        # support on many builds but not all, and the script only advertises
        # AVIF in the manifest when every file actually encodes, so a miss
        # would silently drop the format rather than fail loudly.
        run: pip install --quiet Pillow pillow-avif-plugin

      - name: Generate variants and optimize
        run: python3 .github/scripts/resize_images.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/images _data/image_variants.yml
          if git diff --cached --quiet; then
            echo "Nothing to do."
            exit 0
          fi
          git commit -m "Regenerate and optimize images"
          git push
