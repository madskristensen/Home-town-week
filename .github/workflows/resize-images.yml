name: Optimize images

on:
  push:
    branches: ["main"]
    paths:
      - "assets/images/**"
      - "script/optimize-new-images.py"
      - ".github/workflows/resize-images.yml"
  workflow_dispatch:

# This job commits back into assets/images, which is one of the paths
# that triggers it. Skipping our own bot stops the loop. A push made
# with this token does not start another workflow. When masters change,
# dispatch Deploy to GitHub Pages so the next build encodes variants
# from the optimized files.
permissions:
  contents: write
  actions: write

concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  resize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python3 -m pip install --quiet Pillow

      - name: Optimize masters added in this push
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 script/optimize-new-images.py

      - name: Commit and push
        id: commit
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unexpected=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              assets/images/*|*.md|*.html|*.yml|*.yaml|*.rb|*.js|*.mjs|*.json|*.py) ;;
              *)
                echo "Refusing to commit unexpected path: $path"
                unexpected=1
                ;;
            esac
          done < <(git diff --name-only HEAD; git ls-files --others --exclude-standard)
          if [ "$unexpected" -ne 0 ]; then
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets/images
          git add -u -- .
          if git diff --cached --quiet; then
            echo "Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Optimize new images"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
