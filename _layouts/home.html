---
layout: default
---
<article class="home wrap">
  <h1>Hometown Week</h1>
  <div class="lede">
    {{ content }}
  </div>
  <section class="cities" aria-label="Cities">
    <h2>Washington</h2>
    <p class="cities-intro"><a href="{{ '/wa/' | relative_url }}">All Washington cities</a></p>
    {%- for city in site.data.cities -%}
    {%- if forloop.first -%}
    {%- include city-card.html priority="high" -%}
    {%- else -%}
    {%- include city-card.html loading="lazy" -%}
    {%- endif -%}
    {%- endfor -%}
  </section>
</article>
