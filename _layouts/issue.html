---
layout: default
---
<article class="issue wrap">
  {%- include breadcrumbs.html -%}
  {%- if page.range -%}
  <p class="issue-range"><time datetime="{{ page.date | date: '%Y-%m-%d' }}/{{ page.end_date }}">{{ page.range }}</time></p>
  {%- endif -%}
  <h1>{{ page.title }}</h1>
  {%- include issue-share.html -%}
  {%- if page.image -%}
  <figure class="hero">
    {%- include responsive-img.html
         src=page.image
         alt=page.image_alt
         priority="high"
         sizes="(min-width: 42rem) 40rem, 100vw" -%}
    {%- if page.image_credit or page.image_source_url -%}
    <figcaption>
      {%- if page.image_credit -%}<span class="credit">{{ page.image_credit }}</span>{%- endif -%}
      {%- if page.image_source_url -%}<a class="source" href="{{ page.image_source_url }}" rel="noopener">Source</a>{%- endif -%}
    </figcaption>
    {%- endif -%}
  </figure>
  {%- endif -%}
  <div class="prose">
    {{ content }}
  </div>
  {%- include suggest-event.html -%}
  {%- include week-nav.html -%}
</article>
