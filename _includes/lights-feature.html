<aside class="lights-feature" aria-label="Christmas Light Finder">
  <div class="lights-feature-layout">
    <figure class="event-photo lights-feature-photo">
      {%- include responsive-img.html
           src="/assets/images/lights/keeners.webp"
           alt="A house covered in blue, red, and white Christmas lights at night."
           loading="eager"
           priority="high"
           sizes="(min-width: 42rem) 22rem, calc(100vw - 3rem)" -%}
      <figcaption>
        <span class="credit">Photo: Seattle Refined</span>
        <a class="source" href="https://seattlerefined.com/holiday/keeners-christmas-bothell-seattle" rel="noopener">Source</a>
      </figcaption>
    </figure>
    <div class="lights-feature-copy">
      <p class="lights-feature-kicker">Eastside only</p>
      <p class="lights-feature-title">The Eastside Christmas Light Finder</p>
      <p class="lights-feature-line">Homes and neighborhood streets lit up across the Eastside, all on one map.</p>
      <a class="lights-feature-btn" href="{{ '/christmas/lights/' | relative_url }}">Open the Christmas Light Finder</a>
    </div>
  </div>
</aside>
