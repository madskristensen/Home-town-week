<aside class="lights-feature" aria-label="Christmas lights map">
  <div class="lights-feature-layout">
    <figure class="event-photo lights-feature-photo">
      {%- include responsive-img.html
           src="/assets/images/lights/map-banner.webp"
           alt=""
           loading="eager"
           priority="high"
           sizes="(min-width: 42rem) 22rem, calc(100vw - 3rem)" -%}
      <figcaption>
        <span class="credit">Photo: Thomas M Bishop, CC BY-SA 4.0</span>
        <a class="source" href="https://commons.wikimedia.org/wiki/File:Christmas_Lights_and_Bokeh.jpg" rel="noopener">Source</a>
      </figcaption>
    </figure>
    <div class="lights-feature-copy">
      <p class="lights-feature-kicker">Eastside only</p>
      <p class="lights-feature-title">The Eastside Christmas lights map</p>
      <p class="lights-feature-line">Homes and neighborhood streets lit up across the Eastside, all on one map.</p>
      <a class="lights-feature-btn" href="{{ '/christmas/lights/' | relative_url }}">Open the lights map</a>
    </div>
  </div>
</aside>
