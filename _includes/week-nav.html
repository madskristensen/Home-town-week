{%- include week-neighbors.html -%}
{%- if prev_issue or next_issue -%}
<nav class="week-nav" aria-label="Other weeks">
  {%- if prev_issue -%}
  <a class="prev" rel="prev" href="{{ prev_issue.url | relative_url }}">
    Previous week
    <span class="meta">{{ prev_issue.range }}</span>
  </a>
  {%- endif -%}
  {%- if next_issue -%}
  <a class="next" rel="next" href="{{ next_issue.url | relative_url }}">
    Next week
    <span class="meta">{{ next_issue.range }}</span>
  </a>
  {%- endif -%}
</nav>
{%- endif -%}
