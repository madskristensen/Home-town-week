{%- assign teaser = include.issue -%}
{%- if teaser.image -%}
<figure class="hero">
  <a href="{{ teaser.url | relative_url }}">
    {%- include responsive-img.html
         src=teaser.image
         alt=teaser.image_alt
         priority="high"
         sizes="(min-width: 42rem) 40rem, 100vw" -%}
  </a>
  {%- if teaser.image_credit or teaser.image_source_url -%}
  <figcaption>
    {%- if teaser.image_credit -%}<span class="credit">{{ teaser.image_credit }}</span>{%- endif -%}
    {%- if teaser.image_source_url -%}<a class="source" href="{{ teaser.image_source_url }}" rel="noopener">Source</a>{%- endif -%}
  </figcaption>
  {%- endif -%}
</figure>
{%- endif -%}
<p class="featured-title"><a href="{{ teaser.url | relative_url }}">{{ teaser.title }}</a></p>
{%- if teaser.hook -%}
<p class="hook">{{ teaser.hook }}</p>
{%- endif -%}
<p class="cta"><a href="{{ teaser.url | relative_url }}">{% if include.current %}Read this week{% else %}Read this issue{% endif %}</a></p>
