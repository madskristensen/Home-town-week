<script data-sw="{{ '/sw.js' | relative_url }}">
(function () {
  // localStorage keys:
  // hw-last-city   city slug of the last city page, such as redmond
  // hw-city-visits city-page loads in this browser
  // hw-shared      "1" after the Share control is used
  // hw-install-dismissed  epoch ms; Not now hides the card until then
  // hw-last-state is an older key. New visits do not write it.
  var DISMISS_KEY = "hw-install-dismissed";
  var CITY_VISITS_KEY = "hw-city-visits";
  var SHARED_KEY = "hw-shared";
  var LAST_CITY_KEY = "hw-last-city";
  var DISMISS_MS = 14 * 24 * 60 * 60 * 1000;

  function runningInstalled() {
    try {
      if (window.matchMedia("(display-mode: standalone)").matches) return true;
      if (window.matchMedia("(display-mode: minimal-ui)").matches) return true;
      if (window.matchMedia("(display-mode: fullscreen)").matches) return true;
      if (window.matchMedia("(display-mode: window-controls-overlay)").matches) return true;
    } catch (err) {}
    return window.navigator.standalone === true;
  }

  function storageGet(key) {
    try {
      return localStorage.getItem(key);
    } catch (err) {
      return null;
    }
  }

  function storageSet(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (err) {}
  }

  function registerServiceWorker() {
    if (!("serviceWorker" in navigator)) return;
    var node = document.querySelector("script[data-sw]");
    var url = (node && node.getAttribute("data-sw")) || "/sw.js";
    var hadController = !!navigator.serviceWorker.controller;

    navigator.serviceWorker.register(url, { scope: "/" }).then(function () {
      if (hadController) return;
      var warmed = false;
      function warm() {
        if (warmed) return;
        warmed = true;
        fetch(location.href, { headers: { Accept: "text/html" } }).catch(function () {});
      }
      if (navigator.serviceWorker.controller) warm();
      navigator.serviceWorker.addEventListener("controllerchange", warm);
    }).catch(function () {});
  }

  if (document.readyState === "complete") registerServiceWorker();
  else window.addEventListener("load", registerServiceWorker);

  function saveLastCity() {
    var article = document.querySelector("article.city-home");
    if (!article) return;
    var city = article.getAttribute("data-city") || "";
    if (!/^[a-z0-9-]+$/.test(city)) return;
    storageSet(LAST_CITY_KEY, city);
  }

  saveLastCity();

  function pacificDay() {
    try {
      var parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Los_Angeles",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
      var year = "";
      var month = "";
      var day = "";
      var i;
      for (i = 0; i < parts.length; i++) {
        if (parts[i].type === "year") year = parts[i].value;
        if (parts[i].type === "month") month = parts[i].value;
        if (parts[i].type === "day") day = parts[i].value;
      }
      if (!year || !month || !day) return "";
      return year + "-" + month + "-" + day;
    } catch (err) {
      return "";
    }
  }

  function parseISO(iso) {
    var match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    if (!match) return null;
    return new Date(Date.UTC(+match[1], +match[2] - 1, +match[3]));
  }

  function isoFromDate(date) {
    var year = date.getUTCFullYear();
    var month = date.getUTCMonth() + 1;
    var day = date.getUTCDate();
    var monthText = month < 10 ? "0" + month : String(month);
    var dayText = day < 10 ? "0" + day : String(day);
    return year + "-" + monthText + "-" + dayText;
  }

  function addDays(date, count) {
    return new Date(date.getTime() + count * 86400000);
  }

  function bucketLabel(iso, todayIso) {
    var today = parseISO(todayIso);
    if (!parseISO(iso) || !today) return "Later";
    if (iso === todayIso) return "Today";
    if (iso === isoFromDate(addDays(today, 1))) return "Tomorrow";
    var daysToSunday = (7 - today.getUTCDay()) % 7;
    var sunday = addDays(today, daysToSunday);
    var saturday = addDays(sunday, -1);
    if (iso === isoFromDate(saturday) || iso === isoFromDate(sunday)) return "This weekend";
    return "Later";
  }

  function insertAfter(node, next) {
    if (node.nextSibling) node.parentNode.insertBefore(next, node.nextSibling);
    else node.parentNode.appendChild(next);
  }

  // Rebuild groups only when the Pacific day has moved past the build day.
  function regroupEvents() {
    var prose = document.querySelector("article.city-home .prose");
    if (!prose) return;
    var built = prose.getAttribute("data-today") || "";
    var today = pacificDay();
    if (!built || !today || built === today) return;
    var cards = Array.prototype.slice.call(prose.querySelectorAll("article.event-card"));
    if (!cards.length) return;
    var headings = prose.querySelectorAll("h2.event-bucket");
    var i;
    for (i = 0; i < headings.length; i++) headings[i].parentNode.removeChild(headings[i]);
    var names = ["Today", "Tomorrow", "This weekend", "Later"];
    var groups = { Today: [], Tomorrow: [], "This weekend": [], Later: [] };
    for (i = 0; i < cards.length; i++) {
      groups[bucketLabel(cards[i].getAttribute("data-date"), today)].push(cards[i]);
    }
    var anchor = document.getElementById("list-updated");
    if (!anchor || anchor.parentNode !== prose) anchor = prose.querySelector("h2");
    if (!anchor) return;
    var cursor = anchor;
    for (i = 0; i < names.length; i++) {
      var list = groups[names[i]];
      if (!list || !list.length) continue;
      var heading = document.createElement("h2");
      heading.className = "event-bucket";
      heading.textContent = names[i];
      insertAfter(cursor, heading);
      cursor = heading;
      var j;
      for (j = 0; j < list.length; j++) {
        insertAfter(cursor, list[j]);
        cursor = list[j];
      }
    }
  }

  regroupEvents();

  var hint = document.getElementById("install-hint");

  function isIOS() {
    var ua = navigator.userAgent || "";
    if (/iPad|iPhone|iPod/.test(ua)) return true;
    return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  }

  function dismissed() {
    var raw = storageGet(DISMISS_KEY);
    if (!raw) return false;
    var until = parseInt(raw, 10);
    if (!isFinite(until)) return false;
    return Date.now() < until;
  }

  if (isIOS()) {
    if (hint && hint.parentNode) hint.parentNode.removeChild(hint);
    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
    });
  } else if (hint) {
    var go = document.getElementById("install-hint-go");
    var dismissBtn = document.getElementById("install-hint-dismiss");
    var deferredPrompt = null;

    function noteCityVisit() {
      if (!document.querySelector("article.city-home")) return false;
      var visits = parseInt(storageGet(CITY_VISITS_KEY) || "0", 10);
      if (!isFinite(visits) || visits < 0) visits = 0;
      visits += 1;
      storageSet(CITY_VISITS_KEY, String(Math.min(visits, 99)));
      return visits >= 2;
    }

    var readyToAsk = noteCityVisit() || storageGet(SHARED_KEY) === "1";

    function hideHint() {
      if (hint) hint.hidden = true;
    }

    function canAsk() {
      return readyToAsk && !runningInstalled() && !dismissed();
    }

    function installButtonLabel() {
      var ua = navigator.userAgent || "";
      var platform = navigator.platform || "";
      var mobile = false;
      try {
        if (navigator.userAgentData) {
          if (navigator.userAgentData.platform) platform = navigator.userAgentData.platform;
          mobile = navigator.userAgentData.mobile === true;
        }
      } catch (err) {}
      if (/Android/i.test(ua) || /Android/i.test(platform) || mobile) return "Add to Home screen";
      // Windows Chrome and Edge install a windowed app from this prompt.
      // Pin to taskbar is a later option, not the install itself.
      return "Install as app";
    }

    function showInstall() {
      if (!canAsk() || !deferredPrompt) return;
      if (go) {
        go.textContent = installButtonLabel();
        go.hidden = false;
      }
      hint.hidden = false;
    }

    document.addEventListener("hw-share", function () {
      storageSet(SHARED_KEY, "1");
      readyToAsk = true;
      showInstall();
    });

    if (dismissBtn && !runningInstalled()) {
      dismissBtn.addEventListener("click", function () {
        storageSet(DISMISS_KEY, String(Date.now() + DISMISS_MS));
        hideHint();
      });
    }

    if (go) {
      go.addEventListener("click", function () {
        if (!deferredPrompt || typeof deferredPrompt.prompt !== "function") return;
        var promptEvent = deferredPrompt;
        deferredPrompt = null;
        var pending;
        try {
          pending = promptEvent.prompt();
        } catch (err) {
          hideHint();
          return;
        }
        Promise.resolve(pending).then(function () {
          return promptEvent.userChoice;
        }).then(function () {
          hideHint();
        }).catch(function () {
          hideHint();
        });
      });
    }

    window.addEventListener("beforeinstallprompt", function (event) {
      if (runningInstalled() || dismissed()) return;
      event.preventDefault();
      deferredPrompt = event;
      showInstall();
    });

    window.addEventListener("appinstalled", function () {
      deferredPrompt = null;
      hideHint();
    });
  }

  var article = document.querySelector("article[data-updated]");
  var note = document.getElementById("list-updated");
  if (article && note) {
    var stamp = article.getAttribute("data-updated") || "";
    if (stamp) {
      var seenKey = "hw-seen:" + location.pathname;
      var previous = storageGet(seenKey);
      if (previous && previous !== stamp) {
        var when = new Date(stamp);
        var label = "";
        if (!isNaN(when.getTime())) {
          label = when.toLocaleDateString("en-US", {
            month: "long",
            day: "numeric",
            year: "numeric",
            timeZone: "America/Los_Angeles"
          });
        }
        note.textContent = label ? "List updated " + label + "." : "List updated.";
        note.hidden = false;
      }
      storageSet(seenKey, stamp);
    }
  }
})();
</script>
