<aside id="install-hint" class="install-card" hidden>
  <div class="install-card-sheet" role="region" aria-labelledby="install-card-name">
    <div class="install-card-head">
      <img class="install-card-icon" src="{{ '/assets/images/apple-touch-icon.png' | relative_url }}" alt="" width="48" height="48">
      <div class="install-card-text">
        <p id="install-card-name" class="install-card-name">Hometown Week</p>
        <p id="install-hint-copy" class="install-card-benefit">Open your city in one tap.</p>
        <p id="install-steps" class="install-steps" hidden>
          <span>Share</span>
          <svg class="install-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 15.2V3.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M7.8 7.5 12 3.4l4.2 4.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7.2 10.2H6.1A1.8 1.8 0 0 0 4.3 12v7.1A1.8 1.8 0 0 0 6.1 20.9h11.8a1.8 1.8 0 0 0 1.8-1.8V12a1.8 1.8 0 0 0-1.8-1.8h-1.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="install-then" aria-hidden="true">→</span>
          <span class="visually-hidden">then</span>
          <span>Add to Home Screen</span>
        </p>
      </div>
    </div>
    <div class="install-card-actions">
      <button type="button" class="install-go" id="install-hint-go" hidden>Install Hometown Week</button>
      <button type="button" class="install-share" id="install-hint-share" hidden>
        <svg class="install-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 15.2V3.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M7.8 7.5 12 3.4l4.2 4.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7.2 10.2H6.1A1.8 1.8 0 0 0 4.3 12v7.1A1.8 1.8 0 0 0 6.1 20.9h11.8a1.8 1.8 0 0 0 1.8-1.8V12a1.8 1.8 0 0 0-1.8-1.8h-1.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Share
      </button>
      <button type="button" class="install-dismiss" id="install-hint-dismiss">Not now</button>
    </div>
  </div>
</aside>
<script data-sw="{{ '/sw.js' | relative_url }}">
(function () {
  var DISMISS_KEY = "hw-install-dismissed";
  var VISIT_KEY = "hw-visits";
  var CITY_KEY = "hw-seen-city";

  function runningInstalled() {
    try {
      if (window.matchMedia("(display-mode: standalone)").matches) return true;
      if (window.matchMedia("(display-mode: minimal-ui)").matches) return true;
      if (window.matchMedia("(display-mode: fullscreen)").matches) return true;
      if (window.matchMedia("(display-mode: window-controls-overlay)").matches) return true;
    } catch (err) {}
    return window.navigator.standalone === true;
  }

  function storageGet(key) {
    try {
      return localStorage.getItem(key);
    } catch (err) {
      return null;
    }
  }

  function storageSet(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (err) {}
  }

  function registerServiceWorker() {
    if (!("serviceWorker" in navigator)) return;
    var node = document.querySelector("script[data-sw]");
    var url = (node && node.getAttribute("data-sw")) || "/sw.js";
    var hadController = !!navigator.serviceWorker.controller;

    navigator.serviceWorker.register(url, { scope: "/" }).then(function () {
      if (hadController) return;
      var warmed = false;
      function warm() {
        if (warmed) return;
        warmed = true;
        fetch(location.href, { headers: { Accept: "text/html" } }).catch(function () {});
      }
      if (navigator.serviceWorker.controller) warm();
      navigator.serviceWorker.addEventListener("controllerchange", warm);
    }).catch(function () {});
  }

  if (document.readyState === "complete") registerServiceWorker();
  else window.addEventListener("load", registerServiceWorker);

  var hint = document.getElementById("install-hint");
  var steps = document.getElementById("install-steps");
  var go = document.getElementById("install-hint-go");
  var shareBtn = document.getElementById("install-hint-share");
  var dismissBtn = document.getElementById("install-hint-dismiss");
  var deferredPrompt = null;

  function engaged() {
    var visits = parseInt(storageGet(VISIT_KEY) || "0", 10);
    if (!isFinite(visits) || visits < 0) visits = 0;
    visits += 1;
    storageSet(VISIT_KEY, String(Math.min(visits, 99)));
    if (document.querySelector("article.city-home")) storageSet(CITY_KEY, "1");
    return visits >= 2 || storageGet(CITY_KEY) === "1";
  }

  var readyToAsk = engaged();

  function isIOS() {
    var ua = navigator.userAgent || "";
    if (/iPad|iPhone|iPod/.test(ua)) return true;
    return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  }

  function placeCard() {
    if (!hint || hint.hidden) {
      document.body.classList.remove("has-install-card");
      document.body.style.paddingBottom = "";
      return;
    }
    document.body.classList.add("has-install-card");
    document.body.style.paddingBottom = hint.offsetHeight + "px";
  }

  function hideHint() {
    if (hint) hint.hidden = true;
    placeCard();
  }

  function canAsk() {
    return hint && readyToAsk && !runningInstalled() && storageGet(DISMISS_KEY) !== "1";
  }

  function showInstall() {
    if (!canAsk()) return;
    if (steps) steps.hidden = true;
    if (shareBtn) shareBtn.hidden = true;
    if (go) go.hidden = false;
    hint.hidden = false;
    placeCard();
  }

  function showIOS() {
    if (!canAsk()) return;
    if (go) go.hidden = true;
    if (steps) steps.hidden = false;
    if (shareBtn) shareBtn.hidden = typeof navigator.share !== "function";
    hint.hidden = false;
    placeCard();
  }

  if (hint && dismissBtn && !runningInstalled()) {
    dismissBtn.addEventListener("click", function () {
      storageSet(DISMISS_KEY, "1");
      hideHint();
    });
  }

  if (go) {
    go.addEventListener("click", function () {
      if (!deferredPrompt || typeof deferredPrompt.prompt !== "function") return;
      var promptEvent = deferredPrompt;
      deferredPrompt = null;
      var pending;
      try {
        pending = promptEvent.prompt();
      } catch (err) {
        hideHint();
        return;
      }
      Promise.resolve(pending).then(function () {
        return promptEvent.userChoice;
      }).then(function () {
        hideHint();
      }).catch(function () {
        hideHint();
      });
    });
  }

  if (shareBtn) {
    shareBtn.addEventListener("click", function () {
      if (typeof navigator.share !== "function") return;
      var pending;
      try {
        pending = navigator.share({
          title: "Hometown Week",
          url: location.href
        });
      } catch (err) {
        return;
      }
      Promise.resolve(pending).catch(function () {});
    });
  }

  window.addEventListener("beforeinstallprompt", function (event) {
    if (runningInstalled() || storageGet(DISMISS_KEY) === "1") return;
    event.preventDefault();
    deferredPrompt = event;
    showInstall();
  });

  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
    hideHint();
  });

  window.addEventListener("resize", placeCard);

  if (isIOS()) showIOS();

  var article = document.querySelector("article[data-updated]");
  var note = document.getElementById("list-updated");
  if (article && note) {
    var stamp = article.getAttribute("data-updated") || "";
    if (stamp) {
      var seenKey = "hw-seen:" + location.pathname;
      var previous = storageGet(seenKey);
      if (previous && previous !== stamp) {
        var when = new Date(stamp);
        var label = "";
        if (!isNaN(when.getTime())) {
          label = when.toLocaleDateString("en-US", {
            month: "long",
            day: "numeric",
            year: "numeric",
            timeZone: "America/Los_Angeles"
          });
        }
        note.textContent = label ? "List updated " + label + "." : "List updated.";
        note.hidden = false;
      }
      storageSet(seenKey, stamp);
    }
  }
})();
</script>
