{%- comment -%}
  Past and regrouped city cards run in this script, before the cached
  page file, so a date roll does not wait on the network. The service
  worker, filters, and install slot live in that cached file.
  The script selects article.event-card. It does not render a card.
{%- endcomment -%}
<script>
(function () {
  function pacificDay() {
    try {
      var parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Los_Angeles",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
      var year = "";
      var month = "";
      var day = "";
      var i;
      for (i = 0; i < parts.length; i++) {
        if (parts[i].type === "year") year = parts[i].value;
        if (parts[i].type === "month") month = parts[i].value;
        if (parts[i].type === "day") day = parts[i].value;
      }
      if (!year || !month || !day) return "";
      return year + "-" + month + "-" + day;
    } catch (err) {
      return "";
    }
  }

  function parseISO(iso) {
    var match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    if (!match) return null;
    return new Date(Date.UTC(+match[1], +match[2] - 1, +match[3]));
  }

  function isoFromDate(date) {
    var year = date.getUTCFullYear();
    var month = date.getUTCMonth() + 1;
    var day = date.getUTCDate();
    var monthText = month < 10 ? "0" + month : String(month);
    var dayText = day < 10 ? "0" + day : String(day);
    return year + "-" + monthText + "-" + dayText;
  }

  function addDays(date, count) {
    return new Date(date.getTime() + count * 86400000);
  }

  function bucketLabel(iso, todayIso) {
    var today = parseISO(todayIso);
    if (!parseISO(iso) || !today) return "Later";
    if (iso === todayIso) return "Today";
    if (iso === isoFromDate(addDays(today, 1))) return "Tomorrow";
    var daysToSunday = (7 - today.getUTCDay()) % 7;
    var sunday = addDays(today, daysToSunday);
    var saturday = addDays(sunday, -1);
    var tomorrowIso = isoFromDate(addDays(today, 1));
    var saturdayIso = isoFromDate(saturday);
    if (iso > tomorrowIso && iso < saturdayIso) return "This week";
    if (iso === saturdayIso || iso === isoFromDate(sunday)) return "This weekend";
    return "Later";
  }

  function cardLastDay(card) {
    return card.getAttribute("data-end") || card.getAttribute("data-date") || "";
  }

  function hidePastEvents() {
    var today = pacificDay();
    if (!today) return;
    var cards = document.querySelectorAll("article.event-card");
    var i;
    for (i = 0; i < cards.length; i++) {
      var last = cardLastDay(cards[i]);
      if (last && last < today) cards[i].classList.add("is-past");
    }
    var headings = document.querySelectorAll("h2.event-bucket");
    for (i = 0; i < headings.length; i++) {
      var node = headings[i].nextElementSibling;
      var any = false;
      if (node && node.classList.contains("card-grid")) {
        var nested = node.querySelectorAll("article.event-card");
        var n;
        for (n = 0; n < nested.length; n++) {
          if (!nested[n].classList.contains("is-past")) any = true;
        }
        if (nested.length) node.classList.toggle("is-past", !any);
      } else {
        while (node && !(node.tagName === "H2" && node.classList.contains("event-bucket"))) {
          if (node.classList && node.classList.contains("event-card") && !node.classList.contains("is-past")) any = true;
          node = node.nextElementSibling;
        }
      }
      if (!any) headings[i].classList.add("is-past");
      else headings[i].classList.remove("is-past");
    }
  }

  function insertAfter(node, next) {
    if (node.nextSibling) node.parentNode.insertBefore(next, node.nextSibling);
    else node.parentNode.appendChild(next);
  }

  function regroupEvents() {
    var eventList = document.querySelector("article.city-home .event-list");
    if (!eventList) return;
    var built = eventList.getAttribute("data-today") || "";
    var today = pacificDay();
    if (!built || !today || built === today) return;
    var cards = Array.prototype.slice.call(eventList.querySelectorAll("article.event-card"));
    cards = cards.filter(function (card) { return !card.classList.contains("is-past"); });
    if (!cards.length) return;
    var i;
    for (i = 0; i < cards.length; i++) cards[i].parentNode.removeChild(cards[i]);
    var headings = eventList.querySelectorAll("h2.event-bucket");
    for (i = 0; i < headings.length; i++) headings[i].parentNode.removeChild(headings[i]);
    var grids = eventList.querySelectorAll(".card-grid");
    for (i = 0; i < grids.length; i++) grids[i].parentNode.removeChild(grids[i]);
    var names = ["Today", "Tomorrow", "This week", "This weekend", "Later"];
    var groups = { Today: [], Tomorrow: [], "This week": [], "This weekend": [], Later: [] };
    for (i = 0; i < cards.length; i++) {
      groups[bucketLabel(cards[i].getAttribute("data-date"), today)].push(cards[i]);
    }
    var anchor = document.getElementById("list-updated");
    if (!anchor || anchor.parentNode !== eventList) anchor = eventList.querySelector("h2");
    if (!anchor) return;
    var cursor = anchor;
    for (i = 0; i < names.length; i++) {
      var list = groups[names[i]];
      if (!list || !list.length) continue;
      var heading = document.createElement("h2");
      heading.className = "event-bucket";
      heading.textContent = names[i];
      insertAfter(cursor, heading);
      var grid = document.createElement("div");
      grid.className = "card-grid";
      insertAfter(heading, grid);
      var j;
      for (j = 0; j < list.length; j++) grid.appendChild(list[j]);
      cursor = grid;
    }
  }

  hidePastEvents();
  regroupEvents();
  hidePastEvents();
})();
</script>
<script type="module" src="{{ site.data.js.page | relative_url }}" data-sw="{{ '/sw.js' | relative_url }}" data-print="{{ site.data.css.print | relative_url }}" fetchpriority="low"></script>
