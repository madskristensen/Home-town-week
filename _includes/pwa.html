<script type="module" data-sw="{{ '/sw.js' | relative_url }}">
(function () {
  // Older keys are not written: hw-last-city, hw-last-state, hw-city-visits,
  // hw-shared, and hw-install-dismissed.

  function runningInstalled() {
    try {
      if (window.matchMedia("(display-mode: standalone)").matches) return true;
      if (window.matchMedia("(display-mode: minimal-ui)").matches) return true;
      if (window.matchMedia("(display-mode: fullscreen)").matches) return true;
      if (window.matchMedia("(display-mode: window-controls-overlay)").matches) return true;
    } catch (err) {}
    return window.navigator.standalone === true;
  }

  function registerServiceWorker() {
    if (!("serviceWorker" in navigator)) return;
    var node = document.querySelector("script[data-sw]");
    var url = (node && node.getAttribute("data-sw")) || "/sw.js";
    navigator.serviceWorker.register(url, { scope: "/", updateViaCache: "none" }).catch(function () {});
  }

  window.addEventListener("load", registerServiceWorker);

  // Run after the browser's own layout. A parser script here forced a
  // reflow of the map, and refetching this page after the worker claimed
  // added an empty follow-up request for the same document.
  requestAnimationFrame(function () {
  function pacificDay() {
    try {
      var parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Los_Angeles",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
      var year = "";
      var month = "";
      var day = "";
      var i;
      for (i = 0; i < parts.length; i++) {
        if (parts[i].type === "year") year = parts[i].value;
        if (parts[i].type === "month") month = parts[i].value;
        if (parts[i].type === "day") day = parts[i].value;
      }
      if (!year || !month || !day) return "";
      return year + "-" + month + "-" + day;
    } catch (err) {
      return "";
    }
  }

  function parseISO(iso) {
    var match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    if (!match) return null;
    return new Date(Date.UTC(+match[1], +match[2] - 1, +match[3]));
  }

  function isoFromDate(date) {
    var year = date.getUTCFullYear();
    var month = date.getUTCMonth() + 1;
    var day = date.getUTCDate();
    var monthText = month < 10 ? "0" + month : String(month);
    var dayText = day < 10 ? "0" + day : String(day);
    return year + "-" + monthText + "-" + dayText;
  }

  function addDays(date, count) {
    return new Date(date.getTime() + count * 86400000);
  }

  function bucketLabel(iso, todayIso) {
    var today = parseISO(todayIso);
    if (!parseISO(iso) || !today) return "Later";
    if (iso === todayIso) return "Today";
    if (iso === isoFromDate(addDays(today, 1))) return "Tomorrow";
    var daysToSunday = (7 - today.getUTCDay()) % 7;
    var sunday = addDays(today, daysToSunday);
    var saturday = addDays(sunday, -1);
    var tomorrowIso = isoFromDate(addDays(today, 1));
    var saturdayIso = isoFromDate(saturday);
    if (iso > tomorrowIso && iso < saturdayIso) return "This week";
    if (iso === saturdayIso || iso === isoFromDate(sunday)) return "This weekend";
    return "Later";
  }

  function insertAfter(node, next) {
    if (node.nextSibling) node.parentNode.insertBefore(next, node.nextSibling);
    else node.parentNode.appendChild(next);
  }

  // Rebuild groups only when the Pacific day has moved past the build day.
  function regroupEvents() {
    var prose = document.querySelector("article.city-home .prose");
    if (!prose) return;
    var built = prose.getAttribute("data-today") || "";
    var today = pacificDay();
    if (!built || !today || built === today) return;
    var cards = Array.prototype.slice.call(prose.querySelectorAll("article.event-card"));
    if (!cards.length) return;
    var headings = prose.querySelectorAll("h2.event-bucket");
    var i;
    for (i = 0; i < headings.length; i++) headings[i].parentNode.removeChild(headings[i]);
    var names = ["Today", "Tomorrow", "This week", "This weekend", "Later"];
    var groups = { Today: [], Tomorrow: [], "This week": [], "This weekend": [], Later: [] };
    for (i = 0; i < cards.length; i++) {
      groups[bucketLabel(cards[i].getAttribute("data-date"), today)].push(cards[i]);
    }
    var anchor = document.getElementById("list-updated");
    if (!anchor || anchor.parentNode !== prose) anchor = prose.querySelector("h2");
    if (!anchor) return;
    var cursor = anchor;
    for (i = 0; i < names.length; i++) {
      var list = groups[names[i]];
      if (!list || !list.length) continue;
      var heading = document.createElement("h2");
      heading.className = "event-bucket";
      heading.textContent = names[i];
      insertAfter(cursor, heading);
      cursor = heading;
      var j;
      for (j = 0; j < list.length; j++) {
        insertAfter(cursor, list[j]);
        cursor = list[j];
      }
    }
  }

  regroupEvents();

  // Chips are in the first HTML. A tap hides cards. Nothing moves on load.
  // Within ages or setting, checked chips OR. Across groups they AND.
  // A price is text on the card, not a chip. Free is the cost chip.
  var filterBoxes = document.querySelectorAll(".event-filters input[data-group]");
  function selectedFilterGroups() {
    var groups = {};
    var i;
    for (i = 0; i < filterBoxes.length; i++) {
      var box = filterBoxes[i];
      if (!box.checked) continue;
      var group = box.getAttribute("data-group");
      if (!group) continue;
      if (!groups[group]) groups[group] = [];
      groups[group].push(box.value);
    }
    return groups;
  }
  function matchingCard(card, groups) {
    var names = Object.keys(groups);
    var i;
    for (i = 0; i < names.length; i++) {
      var group = names[i];
      var value = card.getAttribute("data-" + group) || "";
      if (groups[group].indexOf(value) === -1) return false;
    }
    return true;
  }
  function applyFilters() {
    var groups = selectedFilterGroups();
    var active = Object.keys(groups).length > 0;
    var visible = 0;
    document.querySelectorAll(".event-card, .hub-card").forEach(function (card) {
      var show = !active || matchingCard(card, groups);
      card.classList.toggle("is-filtered-out", !show);
      if (show) visible += 1;
    });
    document.querySelectorAll("h2.event-bucket").forEach(function (heading) {
      var any = false;
      var node = heading.nextElementSibling;
      while (node && !node.classList.contains("event-bucket") && !node.classList.contains("filter-empty") && !node.classList.contains("suggest-event")) {
        if (node.classList.contains("event-card") && !node.classList.contains("is-filtered-out")) any = true;
        node = node.nextElementSibling;
      }
      heading.classList.toggle("is-filtered-out", active && !any);
    });
    document.querySelectorAll(".hub-section").forEach(function (section) {
      var cards = section.querySelectorAll(".hub-card");
      if (!cards.length) return;
      var any = false;
      var i;
      for (i = 0; i < cards.length; i++) {
        if (!cards[i].classList.contains("is-filtered-out")) any = true;
      }
      section.classList.toggle("is-filtered-out", active && !any);
    });
    document.querySelectorAll(".hub-toc li").forEach(function (item) {
      var link = item.querySelector("a");
      if (!link) return;
      var id = (link.getAttribute("href") || "").replace(/^#/, "");
      var section = id ? document.getElementById(id) : null;
      if (!section) return;
      var cards = section.querySelectorAll(".hub-card");
      var any = false;
      var i;
      for (i = 0; i < cards.length; i++) {
        if (!cards[i].classList.contains("is-filtered-out")) any = true;
      }
      item.classList.toggle("is-filtered-out", active && cards.length > 0 && !any);
    });
    document.querySelectorAll(".filter-empty").forEach(function (note) {
      note.hidden = !active || visible > 0;
    });
  }
  for (var filterIndex = 0; filterIndex < filterBoxes.length; filterIndex++) {
    filterBoxes[filterIndex].addEventListener("change", applyFilters);
  }

  var installLink = document.getElementById("install-link");

  function isIOS() {
    var ua = navigator.userAgent || "";
    if (/iPad|iPhone|iPod/.test(ua)) return true;
    return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  }

  function hideInstallLink() {
    if (installLink) installLink.hidden = true;
  }

  function installLinkLabel() {
    var ua = navigator.userAgent || "";
    var platform = navigator.platform || "";
    var mobile = false;
    try {
      if (navigator.userAgentData) {
        if (navigator.userAgentData.platform) platform = navigator.userAgentData.platform;
        mobile = navigator.userAgentData.mobile === true;
      }
    } catch (err) {}
    if (/Android/i.test(ua) || /Android/i.test(platform) || mobile) return "Add to Home screen";
    return "Pin to taskbar";
  }

  if (isIOS() || runningInstalled()) {
    hideInstallLink();
    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
    });
  } else if (installLink) {
    var deferredPrompt = null;

    installLink.addEventListener("click", function () {
      if (!deferredPrompt || typeof deferredPrompt.prompt !== "function") return;
      var promptEvent = deferredPrompt;
      deferredPrompt = null;
      var pending;
      try {
        pending = promptEvent.prompt();
      } catch (err) {
        hideInstallLink();
        return;
      }
      Promise.resolve(pending).then(function () {
        return promptEvent.userChoice;
      }).then(function () {
        hideInstallLink();
      }).catch(function () {
        hideInstallLink();
      });
    });

    window.addEventListener("beforeinstallprompt", function (event) {
      if (runningInstalled()) return;
      event.preventDefault();
      deferredPrompt = event;
      installLink.textContent = installLinkLabel();
      installLink.hidden = false;
    });

    window.addEventListener("appinstalled", function () {
      deferredPrompt = null;
      hideInstallLink();
    });
  }

  });
})();
</script>
