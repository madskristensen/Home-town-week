<header class="site-header">
  <div class="wrap home-mast">
    <div class="mast-title-row">
      <p class="brand"><a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}><svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="34" height="34" aria-hidden="true" focusable="false"><rect x="2" y="4" width="28" height="26" rx="5" fill="#3f7d5f"/><rect x="4" y="12" width="24" height="16" rx="2.5" fill="#fffdf8"/><rect class="mark-bind" x="8" y="2" width="4" height="6" rx="2" fill="#243044"/><rect class="mark-bind" x="20" y="2" width="4" height="6" rx="2" fill="#243044"/><path d="M16 12.5 L22 19 H19.5 L24 25.5 H8 L12.5 19 H10 Z" fill="#3f7d5f"/><rect x="14" y="25.5" width="4" height="2.5" fill="#243044"/></svg><span class="brand-name">Eastside Family Calendar</span></a></p>
      <details class="cities-menu" id="cities-menu">
        <summary aria-controls="cities-panel">Cities</summary>
        <div class="cities-panel">
          <nav id="cities-panel" aria-label="Cities">
            <ul>
              {%- for menu_city in site.data.cities -%}
              {%- capture menu_city_url -%}/{{ menu_city.id }}/{%- endcapture -%}
              <li><a href="{{ menu_city_url | strip | relative_url }}"{% if page.city == menu_city.id %} aria-current="page" class="is-here"{% endif %}>{{ menu_city.name }}</a></li>
              {%- endfor -%}
            </ul>
          </nav>
        </div>
      </details>
    </div>
  </div>
</header>
