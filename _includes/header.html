<header class="site-header site-header--compact">
  <div class="wrap home-mast">
    <div class="mast-title-row">
      <p class="brand"><a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Eastside Family Calendar</a></p>
      <details class="cities-menu">
        <summary aria-controls="cities-panel">Cities</summary>
        <div class="cities-panel">
          <nav id="cities-panel" aria-label="Cities">
            <ul>
              {%- for menu_city in site.data.cities -%}
              {%- capture menu_city_url -%}/{{ menu_city.id }}/{%- endcapture -%}
              <li><a href="{{ menu_city_url | strip | relative_url }}"{% if page.city == menu_city.id %} aria-current="page" class="is-here"{% endif %}>{{ menu_city.name }}</a></li>
              {%- endfor -%}
            </ul>
          </nav>
        </div>
      </details>
    </div>
  </div>
</header>
