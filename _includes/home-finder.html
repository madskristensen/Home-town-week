<script type="application/json" id="city-places">
[
{%- assign emitted = false -%}
{%- for city in site.data.cities -%}
  {%- assign place_issues = site.issues | where: "city", city.id | where: "state", city.state -%}
  {%- if city.lat and city.lon and place_issues.size > 0 -%}
    {%- include current-issue.html issues=place_issues -%}
    {%- if current_issue -%}
      {%- assign place_href = current_issue.url -%}
    {%- else -%}
      {%- capture place_href -%}/{{ city.state }}/{{ city.id }}/{%- endcapture -%}
    {%- endif -%}
    {%- if emitted -%},{%- endif -%}
    {"name":{{ city.name | jsonify }},"state":{{ city.state_name | jsonify }},"code":{{ city.state | jsonify }},"summary":{{ city.tagline | default: city.summary | jsonify }},"lat":{{ city.lat }},"lon":{{ city.lon }},"href":{{ place_href | strip | relative_url | jsonify }}}
    {%- assign emitted = true -%}
  {%- endif -%}
{%- endfor -%}
]
</script>
<script>
(function () {
  var NEAR_MILES = 80;
  var MAX_MATCHES = 8;

  function loadPlaces() {
    var node = document.getElementById("city-places");
    if (!node) return [];
    var data;
    try {
      data = JSON.parse(node.textContent);
    } catch (err) {
      return [];
    }
    if (!data || !data.length) return [];
    var out = [];
    var i;
    for (i = 0; i < data.length; i++) {
      var item = data[i];
      if (!item || typeof item.name !== "string" || typeof item.href !== "string") continue;
      if (item.href.charAt(0) !== "/" || item.href.indexOf("//") !== -1) continue;
      var lat = Number(item.lat);
      var lon = Number(item.lon);
      if (!isFinite(lat) || !isFinite(lon)) continue;
      out.push({
        name: item.name,
        state: item.state || "",
        code: item.code || "",
        summary: item.summary || "",
        lat: lat,
        lon: lon,
        href: item.href
      });
    }
    return out;
  }

  function haversine(lat1, lon1, lat2, lon2) {
    var radius = 3958.8;
    var p1 = lat1 * Math.PI / 180;
    var p2 = lat2 * Math.PI / 180;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(p1) * Math.cos(p2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * radius * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  function nearest(lat, lon, places) {
    var best = null;
    var i;
    for (i = 0; i < places.length; i++) {
      var miles = haversine(lat, lon, places[i].lat, places[i].lon);
      if (!best || miles < best.miles) best = { place: places[i], miles: miles };
    }
    return best;
  }

  function milesLabel(miles) {
    if (miles < 0.5) return "Less than a mile away";
    var n = Math.round(miles);
    if (n < 1) n = 1;
    return "About " + n + (n === 1 ? " mile away" : " miles away");
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function norm(value) {
    return String(value || "").toLowerCase().replace(/['\u2019]/g, "").replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim();
  }

  var places = loadPlaces();
  var section = document.getElementById("this-week");
  var button = document.getElementById("near-button");
  var note = document.getElementById("near-note");
  var weekTitle = document.getElementById("this-week-title");
  var card = document.getElementById("near-card");
  var message = document.getElementById("near-message");
  var form = document.getElementById("city-search");
  var input = document.getElementById("city-query");
  var matches = document.getElementById("city-matches");
  var empty = document.getElementById("city-empty");
  var status = document.getElementById("city-status");
  var pending = false;

  function revealWeek() {
    if (weekTitle) weekTitle.hidden = false;
    if (section) section.classList.add("has-result");
  }

  function showMessage(text) {
    revealWeek();
    if (card) {
      card.hidden = true;
      card.removeAttribute("href");
      card.textContent = "";
    }
    if (message) {
      message.hidden = false;
      message.textContent = text;
    }
  }

  function showCard(place, miles) {
    if (!card) return;
    revealWeek();
    if (message) {
      message.hidden = true;
      message.textContent = "";
    }
    var where = place.state;
    var away = milesLabel(miles);
    if (where && away) where += ", " + away;
    else where = where || away;
    card.textContent = "";
    card.href = place.href;
    card.appendChild(el("span", "near-kicker", "Near you"));
    card.appendChild(el("span", "near-city", place.name));
    if (where) card.appendChild(el("span", "near-where", where));
    if (place.summary) card.appendChild(el("span", "near-summary", place.summary));
    card.appendChild(el("span", "near-go", "Open this week's digest"));
    card.hidden = false;
  }

  function setLocatePending(isPending) {
    pending = isPending;
    if (section) {
      if (isPending) section.setAttribute("aria-busy", "true");
      else section.removeAttribute("aria-busy");
    }
    if (!button) return;
    button.disabled = isPending;
    if (isPending) button.setAttribute("aria-busy", "true");
    else button.removeAttribute("aria-busy");
    button.setAttribute("aria-label", isPending ? "Looking nearby" : "Use my location");
  }

  function finishLookup() {
    setLocatePending(false);
  }

  function locate() {
    if (!places.length) {
      showMessage("Search for your city, or browse by state.");
      return;
    }
    if (!window.isSecureContext || !navigator.geolocation) return;
    if (pending) return;
    setLocatePending(true);
    navigator.geolocation.getCurrentPosition(function (pos) {
      finishLookup();
      var found = nearest(pos.coords.latitude, pos.coords.longitude, places);
      if (!found || found.miles > NEAR_MILES) {
        showMessage("No city we cover is close enough to call nearby. Search for one, or browse by state.");
        return;
      }
      showCard(found.place, found.miles);
    }, function (err) {
      finishLookup();
      if (err && err.code === 1) {
        showMessage("Location stays off until the browser allows it. Search for your city, or browse by state.");
      } else if (err && err.code === 3) {
        showMessage("That took too long. Try again, or search for your city.");
      } else {
        showMessage("We could not read a location just now. Search for your city, or browse by state.");
      }
    }, {
      enableHighAccuracy: false,
      timeout: 12000,
      maximumAge: 300000
    });
  }

  if (button && note) {
    if (!navigator.geolocation) {
      button.hidden = true;
      note.textContent = "This browser cannot share a location. Search for your city, or browse by state.";
    } else if (!window.isSecureContext) {
      button.hidden = true;
      note.textContent = "Use your location is available on the secure site. Search for your city, or browse by state.";
    } else {
      button.addEventListener("click", locate);
      if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: "geolocation" }).then(function (result) {
          if (result && result.state === "granted") locate();
        }).catch(function () {});
      }
    }
  }

  function rank(place, query) {
    var name = norm(place.name);
    var state = norm(place.state);
    var code = norm(place.code);
    if (name.indexOf(query) === 0) return 1;
    var words = name.split(" ");
    var i;
    for (i = 0; i < words.length; i++) {
      if (words[i].indexOf(query) === 0) return 2;
    }
    if (query.length >= 3 && name.indexOf(query) !== -1) return 3;
    if (code === query || state.indexOf(query) === 0) return 4;
    if (query.length >= 3 && state.indexOf(query) !== -1) return 5;
    return 0;
  }

  function closeMatches() {
    if (!matches || !input) return;
    matches.hidden = true;
    matches.textContent = "";
    input.setAttribute("aria-expanded", "false");
  }

  function renderMatches() {
    if (!input || !matches || !status) return;
    var query = norm(input.value);
    if (!query) {
      closeMatches();
      if (empty) empty.hidden = true;
      status.textContent = "";
      return;
    }
    var hits = [];
    var i;
    for (i = 0; i < places.length; i++) {
      var score = rank(places[i], query);
      if (score) hits.push({ place: places[i], rank: score });
    }
    hits.sort(function (a, b) {
      if (a.rank !== b.rank) return a.rank - b.rank;
      if (a.place.name < b.place.name) return -1;
      if (a.place.name > b.place.name) return 1;
      return 0;
    });
    matches.textContent = "";
    if (!hits.length) {
      matches.hidden = true;
      input.setAttribute("aria-expanded", "false");
      if (empty) {
        empty.hidden = false;
        empty.textContent = "No city by that name yet.";
      }
      status.textContent = "No city by that name yet.";
      return;
    }
    if (empty) empty.hidden = true;
    var shown = hits.slice(0, MAX_MATCHES);
    for (i = 0; i < shown.length; i++) {
      var place = shown[i].place;
      var item = document.createElement("li");
      var link = document.createElement("a");
      link.href = place.href;
      link.appendChild(el("span", "match-name", place.name));
      if (place.state) link.appendChild(el("span", "match-state", place.state));
      item.appendChild(link);
      matches.appendChild(item);
    }
    matches.hidden = false;
    input.setAttribute("aria-expanded", "true");
    if (hits.length === 1) status.textContent = "1 city.";
    else if (hits.length > shown.length) status.textContent = "Showing " + shown.length + " of " + hits.length + " cities.";
    else status.textContent = hits.length + " cities.";
  }

  if (form && input && matches) {
    input.addEventListener("input", renderMatches);
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var first = matches.querySelector("a");
      if (first && !matches.hidden) window.location.href = first.href;
    });
    form.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeMatches();
        if (empty) empty.hidden = true;
        input.focus();
        return;
      }
      var links = matches.querySelectorAll("a");
      if (!links.length || matches.hidden) return;
      var current = -1;
      var i;
      for (i = 0; i < links.length; i++) {
        if (links[i] === document.activeElement) current = i;
      }
      if (event.key === "ArrowDown") {
        event.preventDefault();
        (links[current + 1] || links[0]).focus();
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        if (current <= 0) input.focus();
        else links[current - 1].focus();
      }
    });
    matches.addEventListener("mousedown", function (event) {
      event.preventDefault();
    });
    var blurTimer;
    input.addEventListener("blur", function () {
      blurTimer = setTimeout(function () {
        if (!matches.contains(document.activeElement)) closeMatches();
      }, 200);
    });
    input.addEventListener("focus", function () {
      clearTimeout(blurTimer);
      if (norm(input.value)) renderMatches();
    });
  }
})();
</script>
