{%- if page.layout == "state" -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": {{ "/" | absolute_url | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.title | jsonify }},
      "item": {{ page.url | absolute_url | jsonify }}
    }
  ]
}
</script>
{%- endif -%}
{%- if page.layout == "city" -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": {{ "/" | absolute_url | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ city.state_name | jsonify }},
      "item": {{ state_hub_url | absolute_url | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ city.name | jsonify }},
      "item": {{ city_url | absolute_url | jsonify }}
    }
  ]
}
</script>
{%- endif -%}
