{%- comment -%}
  One Eastside newsletter, not one per city. Plain HTML, no script.
  Sits at the end of main, above the footer rule. Once per page.
{%- endcomment -%}
<form class="newsletter" action="https://buttondown.com/api/emails/embed-subscribe/madskristensen" method="post" aria-labelledby="newsletter-lead">
  <p class="newsletter-lead" id="newsletter-lead">Weekend picks by email, every Thursday</p>
  <div class="newsletter-fields">
    <label class="visually-hidden" for="newsletter-email">Email</label>
    <input id="newsletter-email" name="email" type="email" required autocomplete="email" placeholder="Email address" aria-describedby="newsletter-note">
    <input type="hidden" name="tag" value="website">
    <button type="submit" class="btn">Subscribe</button>
  </div>
  <p class="newsletter-fine" id="newsletter-note">One email a week. Unsubscribe anytime.</p>
</form>
