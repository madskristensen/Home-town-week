<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{%- comment -%}
  Layout CSS has to be available before the first paint. WebKit will paint
  a frame before an external sheet applies, and it will not treat a
  stylesheet that follows a <script> (including JSON-LD) as render-blocking.
  Inline the same files, then a normal blocking link: no media=print swap,
  no async/defer. relative_url keeps an empty baseurl on hometownweek.com.
{%- endcomment -%}
{%- assign css_version = site.time | date: '%s' -%}
<style>
{{ "/assets/css/main.css" | inline_css }}
{%- if page.city or page.layout == "state" -%}
{{ "/assets/css/city.css" | inline_css }}
{%- endif -%}
</style>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ css_version }}">
{%- if page.city or page.layout == "state" -%}
<link rel="stylesheet" href="{{ '/assets/css/city.css' | relative_url }}?v={{ css_version }}">
{%- elsif page.layout == "home" -%}
<link rel="prefetch" href="{{ '/assets/css/city.css' | relative_url }}?v={{ css_version }}" as="style">
{%- endif %}
<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="48x48" href="{{ '/assets/images/icon-48.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/images/icon-192.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/images/logo.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap">
{%- include seo.html -%}
