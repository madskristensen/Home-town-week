{%- comment -%}
  Site footer. One quiet row: About, Partner with us, Feed, and the
  install link when the browser offers it. The family credit sits under that.
{%- endcomment -%}
<footer class="site-footer">
  <div class="wrap">
    <ul class="footer-meta">
      <li><a href="{{ '/about/' | relative_url }}"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a></li>
      <li><a href="{{ '/partner/' | relative_url }}"{% if page.url == "/partner/" %} aria-current="page"{% endif %}>Partner with us</a></li>
      <li><a href="{{ '/feed.xml' | relative_url }}">Feed</a></li>
      <li class="footer-install-slot"><button type="button" id="install-link" class="footer-install" hidden>Add to Home screen</button></li>
    </ul>
    <p class="footer-family">Made by an Eastside family, for Eastside families. We also blog at <a href="https://afterpickup.com">After Pickup</a>.</p>
  </div>
</footer>
