title: Eastside Family Calendar
tagline: Family events on the Eastside
description: >-
  Upcoming family events in Eastside cities, so you never miss the fun.
# Canonical host. Still hometownweek.com until DNS for eastsidecalendar.com
# is ready. To flip the host, see the domain note in README: change url here,
# the same url in _config.domain.yml, the CNAME file, and the IndexNow sitemap
# URL in .github/workflows/pages.yml.
url: https://hometownweek.com
baseurl: ""
lang: en-US
timezone: America/Los_Angeles
logo: /assets/images/logo.png
image: /assets/images/og-image.png
image_alt: Eastside Family Calendar. Upcoming family events on the Eastside.
repository: madskristensen/Home-town-week

author:
  name: Mads Kristensen
  url: https://hometownweek.com/about/
  twitter: madskristensen

twitter:
  username: madskristensen
  card: summary_large_image

social:
  name: Eastside Family Calendar
  links:
    - https://github.com/madskristensen/Home-town-week

markdown: kramdown
kramdown:
  input: GFM
  # Keep "---" as typed so a typographic pass cannot invent em dashes.
  typographic_symbols:
    em_dash: "---"
    en_dash: "--"

sass:
  style: compressed

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - .ruby-version
  - .gitignore
  - _config.domain.yml
  - artifacts
  - script

