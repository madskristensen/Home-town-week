title: Eastside Family Calendar
tagline: Family events on the Eastside
description: >-
  Upcoming family events in Eastside cities, so you never miss the fun.
# Canonical host. Pages serves www.eastsidecalendar.com, and the naked
# domain redirects there. CNAME must stay www.eastsidecalendar.com so a
# deploy does not revert that setting. IndexNow must request the sitemap
# on this host.
url: https://www.eastsidecalendar.com
baseurl: ""
lang: en-US
timezone: America/Los_Angeles
logo: /assets/images/logo.png
image: /assets/images/og-home.png
image_alt: Eastside Family Calendar map of 14 Eastside towns. Family events, updated daily.
repository: madskristensen/Home-town-week

# Optional Google Search Console token. Leave this empty until Search
# Console gives you a value. An empty value does not print a meta tag.
google_site_verification: ""

author:
  name: Mads Kristensen
  url: https://www.eastsidecalendar.com/about/
  twitter: madskristensen

twitter:
  username: madskristensen
  card: summary_large_image

social:
  name: Eastside Family Calendar
  links: []

markdown: kramdown
kramdown:
  input: GFM
  # Keep "---" as typed so a typographic pass cannot invent em dashes.
  typographic_symbols:
    em_dash: "---"
    en_dash: "--"

sass:
  style: compressed

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - .ruby-version
  - .gitignore
  - _config.domain.yml
  - artifacts
  - script
  - node_modules
  - .share-cache
  - requirements.txt
  - assets/leaflet/leaflet.full.css

