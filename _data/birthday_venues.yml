# Kids birthday party venues for /birthday-venues/.
# One row per venue in the 15 cities. Verify each row on the venue's own
# party page and link that page in source. Never link or quote a lead site.
# Required: id, name, city, address, description, source.
# city is a city id from _data/cities.yml. Preston uses issaquah and
# Covington uses maple-valley.
# setting is Indoor or Outdoor. types are the filter chips (Play, Sports,
# Art, Swim, Dance, Cooking, Museum, Animals and farms, Park shelter,
# Games and arcades, Skating).
# party_room: true when the package includes a private room or space.
# toddlers: true only when the venue is aimed at under 5.
# price_level is 1 to 4 from the published base party package. It shows as
# a quiet $ marker by the town, never as a tag pill. Leave it off when the
# venue publishes no price. 1 = free or under $150 (park shelters),
# 2 = $150 to $299, 3 = $300 to $499, 4 = $500 and up.
# description is our own words, about 250 characters, no em dashes.
# photo is image, alt, credit, credit_url, license. Prefer CC0, CC BY,
# CC BY-SA, or public domain. A venue photo uses credit "Photo: <name>"
# and license organizer. No recognizable kids. With no photo the build
# uses photo_key (a key in _data/venue_images.yml), then the designed
# party card. A company logo is allowed (credit "Logo: <name>"), padded
# on a plain background in assets/images/birthdays/logos/. Never a pool or themed photo: the picture must show the venue.
# last_verified is the day the party page was checked, YYYY-MM-DD.
