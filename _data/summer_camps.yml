# Day camps for /summer-camps/. One row per camp.
# The build compares reg_on and signup_open with today in
# America/Los_Angeles and writes Open now, Opens in N days, or
# Not posted yet. confirmed_2027 is only for a fact posted on the
# camp's own site. A 2026 date is a hint, not a promise.
# Day camps only. Church camps stay off, except SAMBICA day camp,
# whose 2027 registration date is posted. Newcastle and Preston are
# just outside the 15 cities. Chains such as Skyhawks are a basic row.
# source is the camp's own page. Never a lead site.
# price is plain text. Do not set cost. Free is the only cost pill,
# and none of these rows are free.
# featured rows need a photo of the venue or organizer. No kids.
# in_directory: false keeps a catalog card out of the town list when
# the named camps under it are already rows.
# {{status}} in signup is replaced at build.
