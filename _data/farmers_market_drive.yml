# Worth the drive on /farmers-markets/: standout markets just outside the
# 15 cities that Eastside families drive to. Same fields as
# farmers_markets.yml, but place_city is the plain city name, not a city id.
# Verify each on its own market page. These get no map pin, so the map
# stays on the Eastside, but lat and lng feed the Distance sort.
- id: ballard-farmers-market
  name: Ballard Farmers Market
  place_city: Seattle
  address: 5300 Ballard Ave NW
  lat: 47.66663
  lng: -122.38305
  season_start: '2026-01-04'
  season_end: '2026-12-27'
  when_open: Open year-round. Sundays, 9 a.m. to 2 p.m.
  when_closed: Back in January. Sundays, 9 a.m. to 2 p.m., year-round.
  description: Year-round Sunday market on the cobblestones of Ballard Avenue NW, rain or shine, with Washington growers only. Sundays, 9 a.m. to 2 p.m.
  source: https://www.sfmamarkets.com/visit-ballard-farmers-market
  source_label: Market site
  last_verified: '2026-10-11'
  photo:
    image: /assets/images/markets/ballard.webp
