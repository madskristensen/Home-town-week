  when: "Sat Nov 28, 2026 through Sun Jan 3, 2027"
  tickets_on: "2026-10-15"
  description: "A walk through Bellevue Botanical Garden after dark, with lights shaped into plants, animals, and waterfalls. Closed Christmas Day. Ages 11 and older are $10. Ages 10 and under are free. $5 nights are Monday through Thursday, Nov 30 to Dec 3 and Dec 7 to Dec 10. First entry is 4:30 p.m. General last entry is 9 p.m., and the lights go out at 9:30 p.m. On $5 nights, last entry is 8 p.m. Each ticket is a half-hour entry time, and tickets are not sold at the door. Tuesday Dec 8 is a sensory-friendly night."
