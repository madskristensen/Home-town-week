# Ticketed family events for /book-ahead/.
# The daily prune deletes a row whose end is before today in
# America/Los_Angeles, and any row with sold_out: true.
# Do not add summer camps. Add a spring or summer ticketed family event
# when the organizer posts it. Price stays in the blurb. Do not set cost.
# ticket_line replaces the on-sale sentence. tickets_on is the sale date.
# Verify dates, price, and ticket status on the organizer's ticket page.
