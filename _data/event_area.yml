# Where an event is allowed to resolve.
# City files may use the 15 cities, Fall City (folded into Snoqualmie),
# Covington (folded into Maple Valley), and the enclaves inside those
# cities. Worth the Drive is the short list of towns and venues outside
# those cities, within about an hour of Bellevue.
# A street direction such as "Ave NE" is not a state. Nebraska is "NE" plus
# a ZIP, or the full name.

