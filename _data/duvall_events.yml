    license: "reader"
  description: "Five acres of pumpkins still on the vine, a corn maze with a shorter path for small children,\
    \ and goats, pigs, and cows. Walking the patch and visiting the animals is free. The hay mow, maze,\
    \ trike track, and corn crib are $5 for ages 5 and under and $10 for ages 6 and up. Infants are free.\
    \ Leashed dogs are allowed. Groups can book weekdays. The farm has not posted a last day, so this\
