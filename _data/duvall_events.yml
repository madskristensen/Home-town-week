  start: "2026-10-02"
  end: "2026-10-31"
  place: "Novelty Hill Farm, 26617 NE 124th Street"
  same_as: "https://noveltyhillfarm.com/pumpkin-patch-%26-fall-fun"
  card: "novelty-hill-farm-pumpkin-patch"
  order: "2"
  heading_id: "novelty-hill-farm-pumpkin-patch"
  when: "Through Oct 31 · Fri 3:00–6:00 p.m., Sat–Sun 10:00 a.m.–5:00 p.m."
  blurbs:
  - "Five acres of pumpkins still on the vine, a corn maze with a shorter path for small children, and\
    \ goats, pigs, and cows. Walking the patch and visiting the animals is free. The hay mow, maze, trike\
    \ track, and corn crib are $5 for ages 5 and under and $10 for ages 6 and up. Infants are free. Leashed\
    \ dogs are allowed. Groups can book weekdays. The farm has not posted a last day, so this listing\
    \ stays up through October."
  links:
  - href: "https://noveltyhillfarm.com/pumpkin-patch-%26-fall-fun"
    label: "Pumpkin patch"
