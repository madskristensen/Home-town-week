  when: Mon, Wed, and Fri mornings in the school year, ages 5 and under
  description: The gym fills with toys, bounce houses, and mats for kids 5 and under, Mondays, Wednesdays, and Fridays from 10:30 a.m. to noon. $4 for Bellevue residents, $5 for everyone else. No play on school breaks.
