# Indoor play spaces and drop-in toddler play for /indoor-play/.
# One row per place or drop-in program in the 15 cities. Verify each row on
# the organizer's own page and link that page in source. Never link or quote
# a lead site or Reddit. Story times stay off this page.
# Required: id, name, city, address, description, source. A row with
# birthday_id reuses name, city, address, lat, and lng from that row in
# _data/birthday_venues.yml when they are left off here.
# types are the filter chips: Play space, Community center, Bounce and
# trampoline, Climbing, Open gym, Museum, Library, Mall play area.
# toddlers: true only when the place or program is aimed at under 5.
# free: true only when the organizer posts it as free. Free is the only cost
# chip; prices stay in when or description text, never in a chip.
# drop_in: true when you can come without booking a class or a session series.
# when is the short schedule line, our own words, shown in the row's meta
# line. description is our own words, about 250 characters, no em dashes,
# used for search and structured data. last_verified is YYYY-MM-DD.
- id: sbcc-indoor-play
  name: South Bellevue Community Center Indoor Play
  city: bellevue
  address: 14509 SE Newport Way, Bellevue
  lat: 47.571395
  lng: -122.157117
  types: [Community center]
  toddlers: true
