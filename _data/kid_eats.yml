# Kid-friendly restaurants, breweries, and cafes for /kid-friendly-restaurants/.
# One row per place in the 15 cities. A place goes on only when its own page
# says kids are welcome (or it is a play cafe), and that page is the source.
# Never link or quote a lead site or Reddit. Taprooms that are 21 and over
# stay off.
# Required: id, name, city, address, description, source. A row with
# birthday_id reuses name, city, address, lat, and lng from that row in
# _data/birthday_venues.yml when they are left off here.
# types are the filter chips: Brewery, Restaurant, Play cafe, Games.
# play_area: true only when the place has its own play space for kids. It
# makes the Play area chip. No price chips.
# when is the short line in the row's meta line, our own words: the kids
# rule, hours limits, or what there is for kids. description is our own
# words, about 250 characters, no em dashes, used for search and structured
# data. last_verified is YYYY-MM-DD.
