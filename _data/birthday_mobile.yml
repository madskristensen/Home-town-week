# Parties that come to you, for the second section of /birthday-venues/.
# Companies that bring a kids birthday party to your home. Verify each on
# its own site: it offers kids birthday parties at home, and its service
# area names Eastside cities, King County, or the Seattle area including
# the Eastside. Lead sites are never linked or quoted.
# service_area is the line on the card. No address, no map pin.
# types and price_level work as in birthday_venues.yml.
# With no photo the card uses the designed party card.
