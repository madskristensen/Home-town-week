# Add a city in alphabetical order within its state. State blocks stay in
# the order the footer and the home page should show them. Each state hub
# reads only its own cities, in this order. lat and lon are the city center
# in decimal degrees, for the home page nearest-city lookup. Coming-soon
# names live in coming_soon.yml until a digest exists. City names stay out
# of the site header. See README for the page files each city needs.
#
# sources: lives on each city entry here, not in a separate file. Each item
# is a name, url, type, and notes. Types: city_hall, parks, allevents,
# theater, market, library, downtown, venue. Prefer the city hall calendar,
# AllEvents for this city and state, and a local theater (kids shows, family
# concerts, community playhouses). Parks, markets, downtown, and the library
# stay on the list. Do not crawl Stay Happening, news blogs, a wrong-city
# AllEvents page, or a library calendar alone.
#
# Cadence: Monday maintains this list only (add, fix, or drop a URL).
# Wednesday and Friday read the list and fill issue copy. They do not edit
# sources. A seed run may do both once. After that, keep the split.
