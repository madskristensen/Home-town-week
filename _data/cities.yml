# Eastside cities, alphabetical. lat and lon are the city center in
# decimal degrees. nearby.yml uses them when choosing neighbors. The
# home page does not read them. Newcastle is not listed. Fall City events
# that passed a source check are folded into Snoqualmie. Covington events
# that passed a source check are folded into Maple Valley.
# Do not add a city page until it has real events.
# The site header is the mark, Eastside Family Calendar, and a Menu button.
#
# tagline: a short place line under the city-home heading. Name the place
# (geography, character, or region), not a list of venues. It is not the
# masthead kicker.
# slogan: the city's official slogan, and only when the city has one.
# It prints directly under the city name when it is set, and nothing
# when it is absent. Do not put a place line in slogan. The sentence
# "Family events and things to do with kids in {City}" is the title,
# description, and structured data, not visible page text.
# logo: optional path to an official city logo, for example
# /assets/images/bellevue/logo.svg. Leave it unset unless usage is
# permitted. The city header shows the image only when logo is set.
#
# hero: the one town photo. It is the visible hero under the city name
# and the og:image and twitter:image. image, alt, credit, license, and
# source. A wide landmark or scenic view of the town. Not a venue
# interior, not identifiable kids or teens, and not a photo that also
# appears on an event card.
#
# sources: lives on each city entry here, not in a separate file. Each item
# is a name, url, type, and notes. Types: city_hall, parks, allevents,
# theater, market, library, downtown, venue, museum, nature, farm, school,
# sports, and news. Prefer the city hall calendar, AllEvents for this city
# and state, and a local theater (kids shows, family concerts, community
# playhouses). Parks, markets, downtown, and the library stay on the list.
# A library branch gets its own row when the city has more than one.
# Do not crawl Stay Happening, a wrong-city AllEvents page, or a library
# calendar alone. A news site belongs here only when it carries dated
# family listings, and Facebook or Eventbrite only when no official page exists.
#
# format and feed_url are optional notes for the editor. format is the
# machine kind: ical, rss, libcal, bibliocommons, allevents, or html.
# type stays the role label (city_hall, parks, and the rest). feed_url
# is the machine feed when it was found apart from the browse page.
# url stays that browse page. Actions does not fetch these. A site-wide
# blog feed is not marked as rss here.
#
# Cadence: Monday is the primary content fill from this list. Update the
# city page upcoming list and {city}_events.yml. Thursday is the midweek
# content fill, a visible update before the weekend. Neither edits sources,
# and neither creates week pages. Do not add an event that has already
# ended. A daily action deletes events whose last day is before today in
# America/Los_Angeles. The first Friday of the month maintains this list
# only (find a new URL or drop a stale one) and does not rewrite event
# copy. A seed run may do both once. After that, keep the split.
# Cultural holidays (Diwali, Lunar New Year, Día de los Muertos, Hanukkah,
# Eid) need a targeted search about six weeks before the date. City calendars
# and library feeds often miss them. Search this list, KCLS events for
# Diwali and rangoli, and the temple and association pages below.
