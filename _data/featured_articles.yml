# Quiet featured-article line on the home page, under the weekend picks
# and above the town map. Not a banner.
#
# Windows use month-day, so they repeat each year. Today is
# America/Los_Angeles. When more than one window contains today, the
# one that started most recently wins. The ISO week then picks one
# line from that window, so a daily rebuild changes it on Monday.
# A line is used only when articles/{article}.md exists.
# March through September, and any empty window, use the fallback.
fallback:
  text: Free things to do with kids
  article: free-things-to-do
windows:
  - id: fall
    start: "10-01"
    end: "11-15"
    items:
      - text: Rainy weekend? Indoor places to play
        article: rainy-day-indoor-play
      - text: Free things to do with kids
        article: free-things-to-do
  - id: lights
    start: "11-16"
    end: "11-30"
    items:
      - text: Out to see the Christmas lights?
        article: christmas-lights
      - text: Where to meet Santa
        article: meeting-santa
  - id: december
    start: "12-01"
    end: "12-24"
    items:
      - text: Out to see the Christmas lights?
        article: christmas-lights
      - text: Where to meet Santa
        article: meeting-santa
      - text: Winter break with kids
        article: winter-break
  - id: christmas-day
    start: "12-25"
    end: "12-25"
    items:
      - text: Winter break with kids
        article: winter-break
  - id: new-year
    start: "12-26"
    end: "12-31"
    items:
      - text: New Year's Eve with kids
        article: new-years-eve
  - id: deep-winter
    start: "01-01"
    end: "02-29"
    items:
      - text: Snow play near the Eastside
        article: snow-play
      - text: Rainy weekend? Indoor places to play
        article: rainy-day-indoor-play

# Guides in the header. Not the home page line.
# An article is listed when today falls in a range, or when it is
# evergreen. Ranges are month-day and repeat each year. The menu
# keeps the first cap articles, then School calendars, bucket lists
# whose ranges contain today, and All guides last. Playgrounds is
# in the Explore menu. Names come from articles.yml. A bucket is
# used only when that page exists.
guides:
  cap: 5
  evergreen:
    - name: School calendars
      href: /no-school-days/
  articles:
    - article: rainy-day-indoor-play
      evergreen: true
    - article: free-things-to-do
      evergreen: true
    - article: salmon-spawning
      ranges:
        - start: "09-01"
          end: "11-30"
    - article: christmas-lights
      ranges:
        - start: "11-16"
          end: "12-31"
    - article: meeting-santa
      ranges:
        - start: "11-16"
          end: "12-24"
    - article: winter-break
      ranges:
        - start: "12-01"
          end: "01-05"
    - article: new-years-eve
      ranges:
        - start: "12-26"
          end: "01-01"
    - article: snow-play
      ranges:
        - start: "01-01"
          end: "02-29"
    - article: no-school-day-ideas
      ranges:
        - start: "12-15"
          end: "01-05"
        - start: "03-20"
          end: "04-15"
    - article: easy-hikes-with-kids
      ranges:
        - start: "04-01"
          end: "09-30"
    - article: best-playgrounds
      ranges:
        - start: "05-01"
          end: "09-15"
  buckets:
    - href: /fall/bucket-list/
      ranges:
        - start: "09-01"
          end: "11-30"
