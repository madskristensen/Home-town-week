# Weekly farmers markets for /farmers-markets/.
# The daily prune does not read this file. Leave a row in place when the
# season ends. The build labels Open now or the return line from
# season_start, season_end, and extra_dates against today in
# America/Los_Angeles. Update the row when the market posts new hours
# or the next season. Bothell has no weekly market to list until a city
# or market site publishes one.
# Required: id, name, city, address, description, source, when_closed.
# when_open is the line used while today is inside the season.
# when_next may contain %s, replaced with the next extra date (Oct 31).
# when_extra_today is used when today is one of those extra dates.
# lat and lng pin the card. Omit both when the market publishes no street.
# photo is image, alt, credit, and credit_url. credit_url must be https.
# Prefer CC0, CC BY, CC BY-SA, or public domain. An organizer photo uses
# credit "Photo: <name>" and license organizer. No recognizable kids.
# city is a city id from _data/cities.yml. Fall City uses snoqualmie.
# description is original. source is the market's own page, or the city
# page when that is the page that states the season.
# last_verified is the day the source was checked, YYYY-MM-DD.
- id: bellevue-farmers-market
  name: Bellevue Farmers Market
  city: bellevue
  address: "1717 Bellevue Way NE"
  lat: 47.626384
  lng: -122.205377
  season_start: "2026-05-21"
  season_end: "2026-10-01"
  extra_dates:
    - "2026-10-31"
    - "2026-11-21"
  when_open: "Open now. Last Thursday of the regular season is Oct 1, 3 to 7 p.m."
  when_next: "Next market is %s. Saturday, 10 a.m. to 3 p.m."
  when_extra_today: "Open today. Saturday, 10 a.m. to 3 p.m."
  when_closed: "Back next May. Thursdays, 3 to 7 p.m., through Oct 1."
  description: "Thursday market in the Bellevue Presbyterian Church lot. Hours are 3 to 7:30 p.m. from May through August, and 3 to 7 p.m. in September through Oct 1. Two Saturday markets follow, on Oct 31 and Nov 21, 10 a.m. to 3 p.m. SNAP EBT is at the info booth, with SNAP Market Match up to $25, plus WIC, Senior FMNP, and SunBucks. There are activities for families."
  source: "https://bellevuefarmersmarket.org/"
  source_label: "Market site"
  last_verified: "2026-10-01"
  photo:
    image: /assets/images/markets/bellevue-logo.webp
    alt: Bellevue Farmers Market logo with a row of drawn vegetables.
    credit: "Logo: Bellevue Farmers Market"
    credit_url: "https://bellevuefarmersmarket.org/"
