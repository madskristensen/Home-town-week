# Christmas light displays for /christmas/#lights.
# This list stays in the hub all year. From Nov 10 through Dec 31 the
# section is first on the page. The rest of the year it follows the events.
# A row here is not an event. Do not copy it into a city page.
#
# Required: id, name, type, city, address, lat, lng, description, source,
# free, last_verified. nights and hours when they are known.
# type is park, house, or street.
# lat and lng are decimal degrees. The town map pin uses them. The page
# does not ask for a visitor's location.
# city is a city id from _data/cities.yml.
# address is a street address, a street, or cross-streets.
# A public venue can use its published street address. A home can use a
# house number only when the owner published it, or a news page already
# names it as the place to visit. Otherwise use the street or the
# cross-streets. Do not take a house number from a photo or a
# real-estate listing.
# description is original. source is the public page.
# free is true or false.
# last_verified is the day the source was checked, YYYY-MM-DD.
# When the source is a past season and the next one is not announced,
# start nights with "Last seen 2025" (use the season year).
# Do not add same_as here. These rows stay out of the Holiday lights events.
