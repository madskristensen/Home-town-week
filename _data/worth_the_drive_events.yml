- name: "WildLanterns"
  setting: "Outdoor"
  signup: true
  start: "2026-11-13"
  end: "2027-01-17"
  place: "Woodland Park Zoo, 5500 Phinney Avenue N"
  town: Seattle
  drive: "about 25 min from Bellevue"
  same_as: "https://zoo.org/wildlanterns/"
  tags: [holiday-lights]
  blurb: "An evening lantern walk at Woodland Park Zoo, 4–9 p.m., last entry 8:30 p.m., from Nov 13 through Jan 17. New lantern displays and a kids interactive zone. Closed Nov 16, 17, 18, 23, 26, and 30, Dec 7, 14, 24, and 25, and Jan 4, 5, 6, 11, 12, and 13. Timed tickets. The 21+ Night Owls evenings, Nov 20, Dec 18, and Jan 2, are adults only."
