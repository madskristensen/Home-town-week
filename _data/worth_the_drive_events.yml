  blurb: "The downtown holiday carousel is back for the first time since 2019, open 11 a.m.–8 p.m. daily Nov 27 through Jan 3. It closes at 3 p.m. Dec 24 and 31 and is closed Christmas Day. Rides are a suggested $4 donation, and a parent riding with a child under 12 rides free. Opening day is the free Tree Lighting Celebration, with crafts from 11 a.m. and the tree lit at 5 p.m., then fireworks."
