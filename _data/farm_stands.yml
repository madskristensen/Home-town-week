# Farm stands for the Farm stands section of /farmers-markets/.
# A farm stand is a farm's own stand, shop, or self-serve shed that sells
# to the public on the farm or from the farm's storefront. Not a CSA-only
# pickup, not wholesale-only, not a u-pick-only pumpkin patch, not a
# grocery store. Verify each on the farm's own site or social page and
# link that page. Reddit, Tilth, and LocalHarvest are leads only.
# Same fields as farmers_markets.yml: city is a city id (Fall City uses
# snoqualmie). lat and lng feed the Distance sort; no map pin.
# season_start and season_end drive the Open now line (when_open);
# leave them off when the farm posts no season, and when_closed is shown.
# setting: Outdoor only for a roadside or self-serve stand; others get no
# setting tag.
# self_serve: true only when the farm says self-serve or honor system.
# photo is optional here: a real photo of that exact farm, credited and
# linked, or no photo. No recognizable kids. No em dashes.
