# Themed pictures for event cards that have no photo of their own and no
# photo of that venue. Wikimedia Commons, CC0, CC BY, CC BY-SA, or public
# domain. No identifiable children or teens.
#
# The first group whose key is on the event tags, or is in the event name
# or place, supplies the pictures. A picture is used once on a page. The
# next card of that type takes the next picture. When the list runs out,
# the card is text with the seasonal motif.
groups:
  - keys: [haunted]
    images:
      - image: /assets/images/themes/haunted-house-night.webp
        alt: A moonlit painting of a house with a pale figure in the doorway.
        credit: "Painting: Edward Poynter, public domain"
        license: Public domain
        source: https://commons.wikimedia.org/wiki/File:Of_a_Haunted_House_in_Mexico_-_Edward_Poynter.png
      - image: /assets/images/themes/haunted-house-snow.webp
        alt: A snowy painting of a turreted house among bare trees.
        credit: "Painting: Georg Emil Libert, public domain"
        license: Public domain
        source: https://commons.wikimedia.org/wiki/File:Georg_Emil_Libert,_Snow_scene_-_the_Haunted_House,_1848,_Victoria_and_Albert_Museum_01.jpg
      - image: /assets/images/themes/jack-o-lantern-night.webp
        alt: A carved jack-o-lantern glowing at night.
        credit: "Photo: Alabama Extension, CC0"
        license: CC0
        source: https://commons.wikimedia.org/wiki/File:Jack-O-Lantern_at_night.jpg
