# Themed pictures for event cards that have no photo of their own and no
# photo of that venue. Wikimedia Commons, CC0, CC BY, CC BY-SA, or public
# domain. No identifiable children or teens.
#
# The first group whose key is in the event name or place supplies the
# pictures. A trunk-or-treat tag wins before that, so a fall festival
# that is a trunk-or-treat still shows cars. If the name does not match,
# the first group whose key is on the tags is used. A picture is used
# once on a page. The next card of that type takes the next picture.
# After that, the hub pool in _data/hub_pools.yml is used, then a
# designed seasonal card. A grid card is not left without a picture.
