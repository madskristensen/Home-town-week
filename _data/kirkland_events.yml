  order: "34"
  heading_id: "impressions-of-spain"
  when: "Sun Nov 1 · 1:00–3:30 p.m."
  blurbs:
    - "Kirkland Civic Orchestra opens its season with a free concert of Spanish and Spanish-inspired music, the first led by its new Music Director, Dr. James O. Welsch. The program has Ravel's Boléro, music from Granados' Goyescas, de Falla's The Three-Cornered Hat, Turina's Procesión del Rocío, and Bizet's Carmen Suite, drawing on Andalusian song and dance. Admission is free, but reserve tickets on Eventbrite. Doors open at 12:30 p.m. and the concert runs about two and a half hours. Very young kids may find the longer pieces hard, and screens in the lobby show the concert if someone needs a break."
